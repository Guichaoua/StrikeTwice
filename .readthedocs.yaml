version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  apt_packages:
    - pandoc
  jobs:
    pre_install:
      # Use the CPU wheel and keep PyPI available for its dependencies.
      - >-
        "$READTHEDOCS_VIRTUALENV_PATH/bin/python" -m pip install
        --index-url https://pypi.org/simple
        --extra-index-url https://download.pytorch.org/whl/cpu
        "torch==2.12.0+cpu"

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

python:
  install:
    - requirements: docs/requirements.txt
    - method: pip
      path: .
