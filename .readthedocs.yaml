version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  apt_packages:
    - pandoc
  jobs:
    pre_install:
      - >-
        "$READTHEDOCS_VIRTUALENV_PATH/bin/python" -m pip install
        --index-url https://download.pytorch.org/whl/cpu "torch>=2.1"

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

python:
  install:
    - requirements: docs/requirements.txt
    - method: pip
      path: .
