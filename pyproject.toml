[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "StrikeTwice"
version = "0.1.0"
description = "PyTorch implementation of StrikeTwice and the Edge–Vertex Transformer"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Gwenn Guichaoua" },
    { name = "Elodie Laine" },
]
dependencies = ["torch>=2.1"]

[project.urls]
Repository = "https://github.com/Guichaoua/StrikeTwice"
Documentation = "https://striketwice.readthedocs.io/en/latest/"

[tool.setuptools.packages.find]
include = ["path_augmented_transformer", "path_augmented_transformer.*"]
namespaces = false

[tool.setuptools.package-data]
path_augmented_transformer = ["resources/task2_reference.pt.gz"]
